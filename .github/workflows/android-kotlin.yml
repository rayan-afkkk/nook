name: Android (Kotlin)

# Compiles the native Kotlin app in nook-android/, runs the core unit tests and uploads a debug APK.
# Uses the GOOGLE_SERVICES_JSON repo secret when it exists; otherwise a placeholder config is generated so the
# code still compiles (that APK builds and installs, but sign-in won't work until the real file is used).
on:
  push:
    paths:
      - 'nook-android/**'
      - '.github/workflows/android-kotlin.yml'
  pull_request:
    paths:
      - 'nook-android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nook-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Add google-services.json
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then
            echo "$GS" > app/google-services.json
            echo "Using the GOOGLE_SERVICES_JSON secret."
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set; using a placeholder (compile check only)."
            cat > app/google-services.json <<'JSON'
          {
            "project_info": { "project_number": "000000000000", "project_id": "placeholder", "storage_bucket": "placeholder.appspot.com" },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.nook.msgapp" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "placeholder" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi
      - name: Core unit tests
        run: ./gradlew --no-daemon :core:test
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nook-debug-apk
          path: nook-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
